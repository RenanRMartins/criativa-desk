services:
  postgres:
    image: postgres:16-alpine
    container_name: socialdesk_db
    environment:
      POSTGRES_DB: socialdesk
      POSTGRES_USER: socialdesk
      POSTGRES_PASSWORD: socialdesk_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U socialdesk"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: socialdesk_redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
